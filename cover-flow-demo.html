<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>3D Artist — Cover Flow Decks</title><link rel="stylesheet" href="orbit-carousel.css"><style>
:root{color-scheme:dark;--accent:#d4e6a5;--text:#f0f3ed;--muted:#a9b2aa;--line:#ffffff20}*{box-sizing:border-box}body{margin:0;background:#101518;color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:48px 24px}a{color:var(--accent)}h1{font-size:clamp(2rem,5vw,4rem);font-weight:450;letter-spacing:-.055em;line-height:1.08;margin:16px 0}header p{color:var(--muted);max-width:620px}header{margin-bottom:32px}.eyebrow{font-size:.7rem;letter-spacing:.2em;color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.viewer{margin-top:28px;padding:22px;border:1px solid var(--line);border-radius:8px}.viewer video{width:100%;max-height:60vh}.viewer button{font:inherit;padding:10px 16px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><header><span class="eyebrow">3D ARTIST / PRODUCT PORTFOLIO</span><h1>Every angle.<br>A different story.</h1><p>Browse project decks. Scroll over the cards, drag or swipe, use arrow keys, or select a side render to bring it forward.</p><a href="index.html">Back to portfolio ↗</a></header><section id="demo-decks" aria-label="Project render decks"></section><p id="demo-status" role="status">Loading projects…</p><section class="viewer" id="demo-viewer" hidden><h2 id="demo-title"></h2><video id="demo-video" controls playsinline></video><p id="demo-description"></p><button id="demo-close" type="button">Close preview</button></section></main>
<script type="module">
import {ProjectDecks} from './project-decks.js';
import {validateDocument} from './project-store.js';
const status=document.getElementById('demo-status'),viewer=document.getElementById('demo-viewer'),video=document.getElementById('demo-video');let trigger;
const decks=new ProjectDecks(document.getElementById('demo-decks'),{prefix:'demo',onOpen:(project,button)=>{trigger=button;viewer.hidden=false;document.getElementById('demo-title').textContent=project.title;document.getElementById('demo-description').textContent=project.description;video.hidden=!project.video;if(project.video)video.src=project.video;viewer.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});document.getElementById('demo-close').focus()}});
document.getElementById('demo-close').addEventListener('click',()=>{video.pause();video.removeAttribute('src');video.load();viewer.hidden=true;trigger?.focus()});
try{const response=await fetch('data/projects.json');if(!response.ok)throw Error('Project data unavailable');await decks.setProjects(validateDocument(await response.json()).projects);status.hidden=true}catch(error){status.textContent=error.message}
</script></body></html>
